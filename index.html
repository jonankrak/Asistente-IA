ual directo."},{id:"di-grave",categoryId:"di",categoryLabel:"Discapacidad Intelectual",levelLabel:"Grave / Profunda",shortTitle:"DI Grave / Profunda",description:"Limitaciones severas en la comunicación verbal y la autonomía; no suelen trabajar con adaptaciones textuales estándar, sino con sistemas alternativos de comunicación.",badgeColor:"border-rose-500 bg-rose-950/40 text-rose-200",recommendedMode:"cognitive",recommendedFormat:"pictograms",recommendedFontSize:"extralarge",recommendedSpeechRate:.8,dyslexiaFriendly:!1,stepByStepFocus:!0,aiDirective:'PERFIL ACTIVO: Discapacidad Intelectual Grave / Profunda. El usuario requiere Sistemas Aumentativos y Alternativos de Comunicación (SAAC / Pictogramas ARASAAC) en lugar de texto estándar. Reduce cada paso a 2-4 conceptos clave ultra básicos (ej. "Beber agua", "Lavar manos", "Pedir ayuda") con verbos y sustantivos muy concretos.'}]},{id:"tea",title:"Trastorno del Espectro Autista (TEA)",emoji:"🧩",subtitle:"Adaptación según necesidad de apoyo en comunicación social, literalidad y flexibilidad cognitiva",options:[{id:"tea-grado1",categoryId:"tea",categoryLabel:"Trastorno del Espectro Autista (TEA)",levelLabel:"Grado 1 (Necesita ayuda)",shortTitle:"TEA Grado 1",description:"Puede comunicarse con oraciones completas, pero presenta dificultades en la interacción social y en la interpretación del lenguaje figurado o el contexto implícito.",badgeColor:"border-emerald-500 bg-emerald-950/40 text-emerald-200",recommendedMode:"cognitive",recommendedFormat:"easy-read",recommendedFontSize:"large",recommendedSpeechRate:1,dyslexiaFriendly:!1,stepByStepFocus:!1,aiDirective:"PERFIL ACTIVO: TEA Grado 1 (Necesita ayuda). El usuario se comunica con oraciones completas pero tiene dificultad con el lenguaje figurado y el contexto implícito. Usa lenguaje 100% literal, explícito y predecible. Explica de forma explícita cualquier norma social o intención implícita, evitando dobles sentidos, ironías, modismos o metáforas."},{id:"tea-grado2",cate  distractor, exige tareas muy breves, guiadas y con constantes pausas de descanso.",badgeColor:"border-rose-500 bg-rose-950/40 text-rose-200",recommendedMode:"cognitive",recommendedFormat:"easy-read",recommendedFontSize:"extralarge",recommendedSpeechRate:.95,dyslexiaFriendly:!1,stepByStepFocus:!0,aiDirective:'PERFIL ACTIVO: TDAH Grave. El usuario se distrae con gran facilidad y exige tareas ultra breves, muy guiadas y con pausas de descanso. Divide la actividad en micro-pasos de máximo 6 palabras cada uno e INTERCALA explícitamente pasos cortos de pausa/descanso y autoverificación cada 2 o 3 acciones (ej. "⏸️ Pausa breve: respira hondo y descansa 30 segundos antes de seguir").'}]}],eu=Za.flatMap(p=>p.options);function tu(p){return eu.find(u=>u.id===p)||eu[0]}class Df{constructor(){Jr(this,"logs",[]);Jr(this,"listeners",new Set);Jr(this,"maxLogs",200);this.add("info","Sistema","Consola de desarrollador inicializada."),this.setupGlobalErrorListeners()}getTimestamp(){const u=new Date,c=String(u.getHours()).padStart(2,"0"),b=String(u.getMinutes()).padStart(2,"0"),x=String(u.getSeconds()).padStart(2,"0"),N=String(u.getMilliseconds()).padStart(3,"0");return`${c}:${b}:${x}.${N}`}setupGlobalErrorListeners(){typeof window>"u"||(window.addEventListener("error",u=>{this.add("error","WindowError",u.message||"Error global de ejecución",`${u.filename||""}:${u.lineno||""}:${u.colno||""}`)}),window.addEventListener("unhandledrejection",u=>{var b,x;const c=((b=u.reason)==null?void 0:b.message)||String(u.reason);this.add("error","PromiseRejection",`Promesa rechazada: ${c}`,(x=u.reason)==null?void 0:x.stack)}))}add(u,c,b,x){let N;if(x!=null)if(typeof x=="string")N=x;else try{N=JSON.stringify(x,null,2)}catch{N=String(x)}const k={id:`log-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,timestamp:this.getTimestamp(),level:u,source:c,message:b,details:N};this.logs=[...this.logs.slice(-(this.maxLogs-1)),k],this.notify()}info(u,c,b){this.add("info",u,c,b)}api(u,c,b){this.add("api",u, ORTOTIPOGRAFÍA Y VOCABULARIO
- Usa palabras cortas, sencillas y de uso frecuente. Evita palabras de más de 4 sílabas siempre que exista una alternativa.
- Evita tecnicismos, extranjerismos y palabras abstractas. Si una palabra difícil es imprescindible, explícala en la frase siguiente.
- Usa siempre la misma palabra para referirte a la misma cosa (no uses sinónimos).
- No uses abreviaturas, siglas sin explicar, MAYÚSCULAS sostenidas, paréntesis, corchetes, puntos suspensivos ni símbolos como &, %, /, #.
- No uses superlativos terminados en -ísimo o -ísima (di "muy grande", no "grandísimo").
- No uses metáforas, ironías, refranes, frases hechas ni sentido figurado.
NÚMEROS Y FECHAS
- Escribe los números con cifras (3, no "tres"). No uses números romanos, porcentajes ni fracciones: di "la mitad", "3 de cada 10".
- Escribe las fechas completas: "lunes 3 de marzo de 2025". Las horas así: "a las 5 de la tarde".
GRAMÁTICA
- Usa la voz activa. NUNCA uses la voz pasiva ("el médico revisa la receta", no "la receta es revisada").
- Usa el presente de indicativo y el imperativo. Evita el subjuntivo, el condicional y los tiempos compuestos.
- Usa el orden sujeto + verbo + complementos.
- Usa frases afirmativas. Evita las negaciones y nunca uses dobles negaciones.
- No uses conectores complejos (no obstante, sin embargo, por consiguiente, asimismo, mediante, cuyo, aunque, ya que). Usa conectores simples: y, pero, porque, entonces, después.
- Dirígete al lector directamente (tú o usted) de forma coherente.
ORACIONES Y ESTRUCTURA
- Frases cortas: máximo 15 palabras. Una sola idea por frase.
- No encadenes oraciones subordinadas.
- Ordena la información de forma lógica y cronológica, de lo más importante a lo menos importante.`,Vf=`Además, el resultado se mostrará con pictogramas ARASAAC (sistema de Comunicación Aumentativa y Alternativa):
