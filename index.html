to."},{id:"di-grave",categoryId:"di",categoryLabel:"Discapacidad Intelectual",levelLabel:"Grave / Profunda",shortTitle:"DI Grave / Profunda",description:"Limitaciones severas en la comunicación verbal y la autonomía; no suelen trabajar con adaptaciones textuales estándar, sino con sistemas alternativos de comunicación.",badgeColor:"border-rose-500 bg-rose-950/40 text-rose-200",recommendedMode:"cognitive",recommendedFormat:"pictograms",recommendedFontSize:"extralarge",recommendedSpeechRate:.8,dyslexiaFriendly:!1,stepByStepFocus:!0,aiDirective:'PERFIL ACTIVO: Discapacidad Intelectual Grave / Profunda. El usuario requiere Sistemas Aumentativos y Alternativos de Comunicación (SAAC / Pictogramas ARASAAC) en lugar de texto estándar. Reduce cada paso a 2-4 conceptos clave ultra básicos (ej. "Beber agua", "Lavar manos", "Pedir ayuda") con verbos y sustantivos muy concretos.'}]},{id:"tea",title:"Trastorno del Espectro Autista (TEA)",emoji:"🧩",subtitle:"Adaptación según necesidad de apoyo en comunicación social, literalidad y flexibilidad cognitiva",options:[{id:"tea-grado1",categoryId:"tea",categoryLabel:"Trastorno del Espectro Autista (TEA)",levelLabel:"Grado 1 (Necesita ayuda)",shortTitle:"TEA Grado 1",description:"Puede comunicarse con oraciones completas, pero presenta dificultades en la interacción social y en la interpretación del lenguaje figurado o el contexto implícito.",badgeColor:"border-emerald-500 bg-emerald-950/40 text-emerald-200",recommendedMode:"cognitive",recommendedFormat:"easy-read",recommendedFontSize:"large",recommendedSpeechRate:1,dyslexiaFriendly:!1,stepByStepFocus:!1,aiDirective:"PERFIL ACTIVO: TEA Grado 1 (Necesita ayuda). El usuario se comunica con oraciones completas pero tiene dificultad con el lenguaje figurado y el contexto implícito. Usa lenguaje 100% literal, explícito y predecible. Explica de forma explícita cualquier norma social o intención implícita, evitando dobles sentidos, ironías, modismos o metáforas."},{id:"tea-grado2",categoryId:"tea",categoryLabel:"Trastorno del Espectro Autista (TEA)",levelLabel:"Grado 2 (Necesita ayuda notable)",shortTitle:"TEA Grado 2",description:"Capacidad de comunicación verbal limitada a frases sencillas, respuestas focales y gran rigidez cognitiva.",badgeColor:"border-amber-500 bg-amber-950/40 text-amber-200",recommendedMode:"cognitive",recommendedFormat:"pictograms",recommendedFontSize:"extralarge",recommendedSpeechRate:.9,dyslexiaFriendly:!1,stepByStepFocus:!0,aiDirective:'PERFIL ACTIVO: TEA Grado 2 (Necesita ayuda notable). Comunicación verbal limitada a frases sencillas y alta rigidez cognitiva. Estructura la información como una rutina secuencial muy predecible y ordenada ("Primero...", "Después...", "Por último..."), con frases muy cortas (máximo 7 palabras), sin ambigüedades ni cambios imprevistos.'},{id:"tea-grado3",categoryId:"tea",categoryLabel:"Trastorno del Espectro Autista (TEA)",levelLabel:"Grado 3 (Necesita ayuda muy notable)",shortTitle:"TEA Grado 3",description:"Comunicación verbal mínima o ausente; requiere apoyo constante para cualquier actividad de aprendizaje.",badgeColor:"border-rose-500 bg-rose-950/40 text-rose-200",recommendedMode:"cognitive",recommendedFormat:"pictograms",recommendedFontSize:"extralarge",recommendedSpeechRate:.8,dyslexiaFriendly:!1,stepByStepFocus:!0,aiDirective:"PERFIL ACTIVO: TEA Grado 3 (Necesita ayuda muy notable). Comunicación verbal mínima o ausente; requiere apoyo constante y secuencias pictográficas muy elementales. Usa consignas de 2 a 4 palabras altamente visuales y concretas (acción + objeto), ideales para tableros de pictogramas ARASAAC y comunicador CAA."}]},{id:"dislexia",title:"Trastornos Específicos del Aprendizaje (Dislexia / Lectoescritura)",emoji:"📖",subtitle:"Adaptación en decodificación lectora, fluidez, espaciado tipográfico y apoyo fonológico/audio",options:[{id:"dislexia-leve",categoryId:"dislexia",categoryLabel:"Dislexia / Lectoescritura",levelLabel:"Leve",shortTitle:"Dislexia Leve",description:"Algunas dificultades para decodificar o comprender, pero el alumno puede compensarlas con apoyos puntuales o más tiempo.",badgeColor:"border-emerald-500 bg-emerald-950/40 text-emerald-200",recommendedMode:"cognitive",recommendedFormat:"easy-read",recommendedFontSize:"large",recommendedSpeechRate:.95,dyslexiaFriendly:!0,stepByStepFocus:!1,aiDirective:"PERFIL ACTIVO: Dislexia / Trastorno de Lectoescritura Leve. Evita palabras largas o trabadas difíciles de decodificar, usa frases bien puntuadas de longitud moderada (máx. 12 palabras) y destaca claramente la idea principal de cada paso."},{id:"dislexia-moderado",categoryId:"dislexia",categoryLabel:"Dislexia / Lectoescritura",levelLabel:"Moderado",shortTitle:"Dislexia Moderada",description:"Dificultades marcadas en la fluidez y comprensión; requiere adaptaciones metodológicas continuas (tipografía especial, lectura fácil, audio).",badgeColor:"border-amber-500 bg-amber-950/40 text-amber-200",recommendedMode:"cognitive",recommendedFormat:"easy-read",recommendedFontSize:"extralarge",recommendedSpeechRate:.85,dyslexiaFriendly:!0,stepByStepFocus:!1,aiDirective:"PERFIL ACTIVO: Dislexia / Trastorno de Lectoescritura Moderado. El usuario tiene dificultades marcadas en fluidez y comprensión lectora. Usa exclusivamente palabras cortas y transparentes (máximo 3-4 sílabas), evita palabras visual o fonéticamente parecidas que generen confusión, y redacta frases muy breves (máximo 10 palabras) pensadas para ser escuchadas con apoyo de voz."},{id:"dislexia-grave",categoryId:"dislexia",categoryLabel:"Dislexia / Lectoescritura",levelLabel:"Grave",shortTitle:"Dislexia Grave",description:"Incapacidad o gran dificultad para la decodificación automatizada, lo que impide la lectura autónoma sin apoyos intensivos.",badgeColor:"border-rose-500 bg-rose-950/40 text-rose-200",recommendedMode:"cognitive",recommendedFormat:"pictograms",recommendedFontSize:"extralarge",recommendedSpeechRate:.8,dyslexiaFriendly:!0,stepByStepFocus:!0,aiDirective:"PERFIL AC ORTOTIPOGRAFÍA Y VOCABULARIO
- Usa palabras cortas, sencillas y de uso frecuente. Evita palabras de más de 4 sílabas siempre que exista una alternativa.
- Evita tecnicismos, extranjerismos y palabras abstractas. Si una palabra difícil es imprescindible, explícala en la frase siguiente.
- Usa siempre la misma palabra para referirte a la misma cosa (no uses sinónimos).
- No uses abreviaturas, siglas sin explicar, MAYÚSCULAS sostenidas, paréntesis, corchetes, puntos suspensivos ni símbolos como &, %, /, #.
- No uses superlativos terminados en -ísimo o -ísima (di "muy grande", no "grandísimo").
- No uses metáforas, ironías, refranes, frases hechas ni sentido figurado.
NÚMEROS Y FECHAS
- Escribe los números con cifras (3, no "tres"). No uses números romanos, porcentajes ni fracciones: di "la mitad", "3 de cada 10".
- Escribe las fechas completas: "lunes 3 de marzo de 2025". Las horas así: "a las 5 de la tarde".
GRAMÁTICA
- Usa la voz activa. NUNCA uses la voz pasiva ("el médico revisa la receta", no "la receta es revisada").
- Usa el presente de indicativo y el imperativo. Evita el subjuntivo, el condicional y los tiempos compuestos.
- Usa el orden sujeto + verbo + complementos.
- Usa frases afirmativas. Evita las negaciones y nunca uses dobles negaciones.
- No uses conectores complejos (no obstante, sin embargo, por consiguiente, asimismo, mediante, cuyo, aunque, ya que). Usa conectores simples: y, pero, porque, entonces, después.
- Dirígete al lector directamente (tú o usted) de forma coherente.
ORACIONES Y ESTRUCTURA
- Frases cortas: máximo 15 palabras. Una sola idea por frase.
- No encadenes oraciones subordinadas.
- Ordena la información de forma lógica y cronológica, de lo más importante a lo menos importante.`,Ff=`Además, el resultado se mostrará con pictogramas ARASAAC (sistema de Comunicación Aumentativa y Alternativa):
